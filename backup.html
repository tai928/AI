<!doctype html> <html lang="ja"> <head> <meta charset="utf-8" /> <meta name="viewport" content="width=device-width,initial-scale=1" /> <title>MBTI Chatbot</title> <style> body { font-family: system-ui, -apple-system, BlinkMacSystemFont; max-width: 820px; margin: 24px auto; padding: 0 14px; background: #fafafa; } h1 { margin-bottom: 8px; } #chat { border: 1px solid #ddd; border-radius: 14px; padding: 14px; height: 60vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fff; } .msg { padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; line-height: 1.5; max-width: 85%; } .me { align-self: flex-end; background: #e9e9e9; } .bot { align-self: flex-start; background: #ffffff; border: 1px solid #eee; } .row { display: flex; gap: 8px; margin-top: 12px; } input { flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid #ddd; font-size: 15px; } button, select { padding: 10px 12px; border-radius: 12px; border: 1px solid #ddd; background: #fff; cursor: pointer; } small { opacity: .6; } textarea { flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid #ddd; font-size: 15px; resize: vertical; min-height: 44px; max-height: 160px; } </style> </head> <body> <h1>MBTI Chatbot 🧠</h1> <div class="row"> <select id="mbti"></select> <select id="verbosity"> <option value="short">短め</option> <option value="normal" selected>普通</option> <option value="long">詳しめ</option> </select> </div> <div id="chat"></div> <div class="row"> <textarea id="msg" placeholder="メッセージを入力…"></textarea> <button id="send">送信</button> </div> <script type="module"> import { MBTI_LIST, MBTI_POLICIES } from "./mbti_policies.js"; const chat = document.getElementById("chat"); const msg = document.getElementById("msg"); const sendBtn = document.getElementById("send"); const mbtiSel = document.getElementById("mbti"); const verbSel = document.getElementById("verbosity"); const saved = JSON.parse(localStorage.getItem("mbtiSettings") || "{}"); const state = { mbti: saved.mbti || "INTJ", verbosity: saved.verbosity || "normal", history: [] }; MBTI_LIST.forEach(t => { const o = document.createElement("option"); o.value = t; o.textContent = t; mbtiSel.appendChild(o); }); mbtiSel.value = state.mbti; verbSel.value = state.verbosity; mbtiSel.onchange = () => { state.mbti = mbtiSel.value; save(); }; verbSel.onchange = () => { state.verbosity = verbSel.value; save(); }; function save() { localStorage.setItem("mbtiSettings", JSON.stringify({ mbti: state.mbti, verbosity: state.verbosity })); } function add(text, cls) { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text; chat.appendChild(d); chat.scrollTop = chat.scrollHeight; } function systemPrompt() { const len = state.verbosity === "short" ? "短く要点のみ。" : state.verbosity === "long" ? "詳しく、根拠と手順も含める。" : "読みやすい標準的な長さ。"; return あなたはMBTIの返答スタイルを切り替えるチャットボット。 人を診断・断定しない。あくまで文章スタイルとして適用する。 返答ルール：${len} 【MBTIポリシー】 ${MBTI_POLICIES[state.mbti]} .trim(); } async function send() { const text = msg.value.trim(); if (!text) return; // 先に確実に消す（送信失敗しても残らない） msg.value = ""; msg.focus(); add(text, "me"); state.history.push({ role: "user", content: text }); add("…考え中", "bot"); const loading = chat.lastChild; try { const res = await fetch("https://ai.taisei-study928.workers.dev/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ system: systemPrompt(), messages: state.history }) }); const data = await res.json(); loading.textContent = data.reply; state.history.push({ role: "assistant", content: data.reply }); } catch (e) { loading.textContent = "エラー：" + e.message; } } sendBtn.onclick = send; add("MBTIを選んで話しかけてみて。", "bot"); </script> </body> </html>
